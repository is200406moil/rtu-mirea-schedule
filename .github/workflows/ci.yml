name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_MONGODB_URL: mongodb://localhost:27017

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install locked dependencies
        run: python -m pip install -r requirements-dev.lock
      - name: Check Python lint
        run: python -m ruff check .
      - name: Check Python formatting
        run: python -m ruff format --check app tests
      - name: Audit Python dependencies
        run: python -m pip_audit --requirement requirements-dev.lock
      - name: Run tests with coverage
        run: python -m pytest --cov=app --cov-branch --cov-report=term-missing --cov-fail-under=70
      - name: Build container
        run: docker build --tag rtu-mirea-schedule:test .
