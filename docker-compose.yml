services:
  mongodb:
    image: mongo:7
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: .
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      DEBUG: ${DEBUG:-false}
      MONGODB_URL: mongodb://mongodb:27017
      SECRET_REFRESH_KEY: ${SECRET_REFRESH_KEY:-development-only}
      REFRESH_LOCK_SECONDS: ${REFRESH_LOCK_SECONDS:-3600}
    ports:
      - "5000:5000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:5000/ready', timeout=2)
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  mongodb_data:
