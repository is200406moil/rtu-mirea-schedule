version: "3.9"

services:
  proxy:
    image: jwilder/nginx-proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - conf:/etc/nginx/conf.d
      - vhost:/etc/nginx/vhost.d
      - dhparam:/etc/nginx/dhparam
      - certs:/etc/nginx/certs:ro
      - /var/run/docker.sock:/tmp/docker.sock:ro
      - acme:/etc/acme.sh
      - html:/usr/share/nginx/html
    networks:
      - proxy
    restart: always

  letsencrypt:
    image: nginxproxy/acme-companion:latest
    volumes_from:
      - proxy
    volumes:
      - certs:/etc/nginx/certs:rw
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - acme:/etc/acme.sh
    restart: always

  mongodb:
    image: mongo:latest
    hostname: mongodb
    container_name: mongodb
    volumes:
      - mongodb_data:/data/db
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    networks:
      - default

  backend:
    build:
      context: .
      args:
        INSTALL_DEV: ${INSTALL_DEV-true}
    env_file:
      - .env
    environment:
      VIRTUAL_HOST: ${DOMAIN-schedule.mirea.ninja}
      DEBUG: false
      MONGODB_URL: mongodb://mongodb:27017
      ENV: production
      DOMAIN: ${DOMAIN-schedule.mirea.ninja}
      LETSENCRYPT_HOST: ${DOMAIN-schedule.mirea.ninja}
      VIRTUAL_PORT: 5000
      PORT: 5000
    restart: always
    networks:
      - proxy
      - default

  cron:
    image: curlimages/curl:8.8.0
    environment:
      SECRET_REFRESH_KEY: ${SECRET_REFRESH_KEY}
      REFRESH_URL: ${REFRESH_URL-http://backend:5000/api/refresh}
      REFRESH_INTERVAL_SECONDS: ${REFRESH_INTERVAL_SECONDS-3600}
    command: [ "sh", "-c", "while true; do if ! curl -fsS -G --data-urlencode \"secret_key=$$SECRET_REFRESH_KEY\" \"$$REFRESH_URL\" >/dev/null; then code=$$?; echo \"Refresh request failed for $$REFRESH_URL at:\"; date -u +%Y-%m-%dT%H:%M:%SZ; echo \"curl exit code: $$code\"; fi; sleep $$REFRESH_INTERVAL_SECONDS; done" ]
    restart: always
    networks:
      - proxy

volumes:
  mongodb_data:
  conf:
  vhost:
  dhparam:
  certs:
  acme:
  html:

networks:
  proxy:
    external:
      true
